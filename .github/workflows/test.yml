name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Die Logiktests brauchen nichts; nur der Browsertest braucht Chromium.
      - name: Abhängigkeiten
        run: npm ci || npm install

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: node --test 'test/*.test.js'
